syntax = "proto3";

package docframe;

message ProtoCondition {
  string uuid = 3;
  repeated string comChannelUUIDs = 4;
  string code = 5;
  bool result = 6;
  bool regenerate = 7;

  // Dropped fields (former parent / _children references). Numbers stay reserved for wire compatibility.
  reserved 1, 2;
  reserved "_children", "parent";
}
