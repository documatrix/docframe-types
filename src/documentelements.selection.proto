syntax = "proto3";

package docframe;

message ProtoSelection {
  string uuid = 3;
  repeated string comChannelUUIDs = 4;
  string internalName = 5;
  string name = 6;
  bool multi = 7;
  uint64 min = 8;
  uint64 max = 9;
  bool arrangeable = 10;
  string onChangeCode = 11;

  // Dropped fields (former parent / _children references). Numbers stay reserved for wire compatibility.
  reserved 1, 2;
  reserved "_children", "parent";
}
