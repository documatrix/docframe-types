syntax = "proto3";

package docframe;

message ProtoSectionReference {
  // LeafDocumentElement (no children)

  string uuid = 2;
  repeated string comChannelUUIDs = 3;
  string tag = 4;
  string format = 5;
  string content = 6;
  string key = 7;

  // Dropped fields (former parent / _children references). Numbers stay reserved for wire compatibility.
  reserved 1;
  reserved "parent";
}
