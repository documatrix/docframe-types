message ProtoOption {
    string key = 1;
    string value = 2;
}

enum PDFPrintingBehavior {
    PDF_PRINTING_BEHAVIOR_DO_NOT_USE_AT_ALL = 0;
    PDF_PRINTING_BEHAVIOR_INPUT = 1;
    PDF_PRINTING_BEHAVIOR_TEXT = 2;
    PDF_PRINTING_BEHAVIOR_INHERIT = 3;
}

message ProtoBaseInputField {
    string name = 1;
    bool meta = 2;
    //
    // If value is not null, the value of value should be used as field value.
    //
    ProtoBoxedString value = 3;
    string formatUUID = 4;
    string dataTypeUUID = 5;
    string onChangeCode = 6;
    string placeholder = 7;
    //
    // if bindDefaultValue is true, the result of the defaultValueCode evaluation will not be copied to the value field, but re-evaluated for every
    // time the input field is rendered.
    // if bindDefaultValue is false, the defaultValueCode will be evaluated once and the result will be copied to the value field.
    //
    bool bindDefaultValue = 8;
    string defaultValueCode = 9;

    bool readonly = 10;

    PDFPrintingBehavior pdfPrintingBehavior = 11;

    string pdfFormName = 12;
    string pdfAltText = 13;

    repeated string comChannelUUIDs = 14;
    string uuid = 15;

    // States if the input field should be hidden in the PDF output. If true, the input field will not be visible in the PDF output.
    bool pdfHidden = 16;

    // States if the input field should be a read-only PDF form field. If true, the field's value cannot be changed in the PDF output.
    bool pdfReadonly = 17;

    // States if the input field should not be printed when the PDF is printed. If false, the PDF annotation flag "Print" is set.
    bool pdfNoPrint = 18;

    // States if the input field should be invisible in the PDF output if no annotation handler is available (PDF annotation flag "Invisible").
    bool pdfInvisible = 19;

    // States if the input field's appearance should not scale with the page magnification (PDF annotation flag "NoZoom").
    bool pdfNoZoom = 20;

    // States if the input field's appearance should not rotate with the page (PDF annotation flag "NoRotate").
    bool pdfNoRotate = 21;

    // States if the input field should not be displayed or interactable on screen, but may still be printed (PDF annotation flag "NoView").
    bool pdfNoView = 22;

    // States if the input field cannot be deleted or have its properties modified in the PDF output (PDF annotation flag "Locked").
    bool pdfLocked = 23;

    // States if the "NoView" flag should be toggled on certain events like mouse hover or selection (PDF annotation flag "ToggleNoView").
    bool pdfToggleNoView = 24;

    // States if the input field's contents cannot be modified in the PDF output (PDF annotation flag "LockedContents").
    bool pdfLockedContents = 25;
}
