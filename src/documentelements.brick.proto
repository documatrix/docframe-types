syntax = "proto3";

package docframe;

message ProtoBrick {
  // like BrickBody::Brick
  uint64 id = 3;
  string internName = 4;
  string uuid = 5;
  bool editable = 6;
  repeated string comChannelUUIDs = 7;
  string name = 8;

  // Dropped fields (former parent / _children references). Numbers stay reserved for wire compatibility.
  reserved 1, 2;
  reserved "_children", "parent";
}
