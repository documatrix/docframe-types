syntax = "proto3";

package docframe;

message ProtoParagraphSetDefault {
  string name = 2;
  string paragraphFormatUUID = 3;
  string uuid = 4;
  repeated string comChannelUUIDs = 5;

  // Dropped fields (former parent / _children references). Numbers stay reserved for wire compatibility.
  reserved 1;
  reserved "parent";
}
