syntax = "proto3";

package docframe;

message ProtoLink {
  string url = 2;
  repeated string comChannelUUIDs = 3;
  string paragraphFormatUUID = 4;
  string paragraphFormatInternalName = 5;
  string urlCode = 6;
  bool bindUrlCode = 7;
  string uuid = 8;
  string displayText = 9;
  string displayTextCode = 10;
  bool bindDisplayTextCode = 11;

  // Dropped fields (former parent / _children references). Numbers stay reserved for wire compatibility.
  reserved 1;
  reserved "_children";
}
