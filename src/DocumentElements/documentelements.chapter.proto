message ProtoChapter {
  // extends BranchDocumentElement
  repeated ProtoDocumentElement _children = 1;
  ProtoDocumentElement parent = 2;
  // extends BranchDocumentElement

  string uuid = 3 [(identity) = true];
  repeated string comChannelUUIDs = 4;
  string title = 5 [(searchable) = true, (weight) = 2.0, (field_group) = "name"];
  string tag = 6;
  repeated string number = 7;
  string key = 8;
  bool createPageBreak = 9;
  bool createDestination = 10;
}
