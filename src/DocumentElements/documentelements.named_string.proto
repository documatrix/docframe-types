message ProtoNamedString {
  // extends BranchDocumentElement
  repeated ProtoDocumentElement _children = 1;
  ProtoDocumentElement parent = 2;
  // extends BranchDocumentElement

  string name = 3 [(searchable) = true, (weight) = 2.0, (field_group) = "name"];
  repeated string comChannelUUIDs = 4;
  string uuid = 5 [(identity) = true];
  string description = 6 [(searchable) = true, (weight) = 1.5, (field_group) = "content"];
  string nameCode = 7;
  bool codeMode = 8;
}
