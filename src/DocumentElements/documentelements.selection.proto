message ProtoSelection {
  // extends BranchDocumentElement
  repeated ProtoDocumentElement _children = 1;
  ProtoDocumentElement parent = 2;
  // extends BranchDocumentElement

  string uuid = 3 [(identity) = true];
  repeated string comChannelUUIDs = 4;
  string internalName = 5 [(searchable) = true, (weight) = 1.5, (field_group) = "name"];
  string name = 6 [(searchable) = true, (weight) = 2.0, (field_group) = "name"];
  bool multi = 7;
  uint64 min = 8;
  uint64 max = 9;
}
