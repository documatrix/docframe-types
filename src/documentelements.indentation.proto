syntax = "proto3";

package docframe;

import "util.measure.proto";

message ProtoIndentation {
  ProtoBoxedMeasure left = 3;
  ProtoBoxedMeasure right = 4;
  string uuid = 5;
  repeated string comChannelUUIDs = 6;

  // Dropped fields (former parent / _children references). Numbers stay reserved for wire compatibility.
  reserved 1, 2;
  reserved "_children", "parent";
}
