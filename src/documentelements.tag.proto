syntax = "proto3";

package docframe;

message ProtoTag {
  string name = 2;
  repeated string comChannelUUIDs = 3;
  string uuid = 4;
  repeated string params = 5;
  string nameCode = 6;
  bool codeMode = 7;

  // Dropped fields (former parent / _children references). Numbers stay reserved for wire compatibility.
  reserved 1;
  reserved "parent";
}
