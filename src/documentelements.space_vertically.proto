syntax = "proto3";

package docframe;

import "util.measure.proto";

message ProtoSpaceVertically {
  ProtoMeasure space = 2;
  repeated string comChannelUUIDs = 3;
  string uuid = 4;

  // Dropped fields (former parent / _children references). Numbers stay reserved for wire compatibility.
  reserved 1;
  reserved "parent";
}
