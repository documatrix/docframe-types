version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/documatrix/docframe-types/docframepb
    - file_option: csharp_namespace
      value: Docframe
plugins:
  # Go messages (docframepb). Version pinned to google.golang.org/protobuf in go.mod.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: .
    opt: module=github.com/documatrix/docframe-types
  # Go ToNode() helpers for every message that is a member of Node.object.
  - local: ["go", "run", "./tools/protoc-gen-docframe-node"]
    out: .
    opt: module=github.com/documatrix/docframe-types
  # TypeScript / JavaScript via protobuf-es. Local plugin so the generator
  # version always matches the @bufbuild/protobuf runtime in package.json.
  - local: node_modules/.bin/protoc-gen-es
    out: build
    opt:
      - target=js+dts
      - js_import_style=legacy_commonjs
  # C#
  - remote: buf.build/protocolbuffers/csharp:v36.2
    out: build/csharp
