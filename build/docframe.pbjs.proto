  ProtoSwissQRDebitor debitor = 2;
}

enum ProtoBarcodeUAMode{
  BARCODE_UA_MODE_SIMPLE = 0;
  BARCODE_UA_MODE_ADVANCED = 1;
}
message ProtoLinebreak {
  //extends DocumentElement
  ProtoDocumentElement parent = 1;
  //extends DocumentElement
  repeated string comChannelUUIDs = 2;

  string uuid = 3 [(identity) = true];
  ProtoBoxedUint32 count = 4;
}
message ProtoBorder {
  ProtoMeasure weight = 1;
  ProtoColor color = 2;
}

message ProtoSideBorders {
  ProtoBorder top = 1;
  ProtoBorder right = 2;
  ProtoBorder bottom = 3;
  ProtoBorder left = 4;
}
enum ProtoPositionMode {
  CENTER = 0;
  LEFT = 1;
  FOLIO = 2;
  RIGHT = 3;
  REVERSE_FOLIO = 4;
}

message ProtoBoxedPositionMode {
  ProtoPositionMode value = 1;
  bool isNull = 2;
}

message ProtoColumnSettings {
  ProtoBoxedMeasure width = 1;
  ProtoBoxedMeasure interColumnSpace = 2;
  ProtoBoxedMeasure positionOffset = 3;
  ProtoPositionMode positionMode = 4;
  ProtoBoxedMeasure outsideMargin = 5;
}
message ProtoGraphicState {
  ProtoBoxedBool bold = 1;
  ProtoBoxedBool italic = 2;
  repeated ProtoColor colorStack = 3;
  ProtoBoxedBool subscript = 4;
  ProtoBoxedBool superscript = 5;
  ProtoBoxedBool underline = 6;
  ProtoBoxedBool strikethrough = 7;
}
message ProtoHtmlParser {

}
enum ProtoUnderlineMode {
  DUMMY_UNDERLINE_MODE = 0; // dummy is needed here, because otherwise protoc command produces error
  WORDS_NO_BLANKS = 1;
  WORDS_AND_BLANKS = 2;
  CHARACTERS_NO_BLANKS = 3;
  CHARACTERS_AND_BLANKS = 4;
}

message ProtoUnderlineSpec {
  ProtoMeasure weight = 1;
  ProtoUnderlineMode mode = 2;
  ProtoColor color = 3;
  int32 offsetEm = 4;
  ProtoRuleStyle style = 5;
}

message ProtoBoxedUnderlineSpec {
  ProtoUnderlineSpec value = 1;
  bool isNull = 2;
}
message ProtoCropSettings {
  ProtoBoxedMeasure x = 1;
  ProtoBoxedMeasure y = 2;
  ProtoBoxedMeasure width = 3;
  ProtoBoxedMeasure height = 4;
}

message ProtoFlipSettings {
  bool x = 1;
  bool y = 2;
}

enum ProtoImageReferencePoint {
  REF_POINT_DO_NOT_USE_AT_ALL = 0;
  REF_POINT_BOTTOM_LEFT = 1;
  REF_POINT_TOP_LEFT = 2;
  REF_POINT_CENTER = 3;
  REF_POINT_BOTTOM_RIGHT = 4;
  REF_POINT_TOP_RIGHT = 5;
}
enum ProtoSemanticType { 
  SEMANTIC_TYPE_NONE = 0;
  SEMANTIC_TYPE_PART = 1;
  SEMANTIC_TYPE_ART = 2;
  SEMANTIC_TYPE_SECT = 3;
  SEMANTIC_TYPE_DIV = 4;
  SEMANTIC_TYPE_TOC = 5;
  SEMANTIC_TYPE_TOCI = 6;
  SEMANTIC_TYPE_REFERENCE = 7;
}
message ProtoOption {
    string key = 1;
    string value = 2 [(searchable) = true, (weight) = 1.5, (field_group) = "content"];
}

enum PDFPrintingBehavior {
    PDF_PRINTING_BEHAVIOR_DO_NOT_USE_AT_ALL = 0;
    PDF_PRINTING_BEHAVIOR_INPUT = 1;
    PDF_PRINTING_BEHAVIOR_TEXT = 2;
    PDF_PRINTING_BEHAVIOR_INHERIT = 3;
}

message ProtoBaseInputField {
    string name = 1 [(searchable) = true, (weight) = 2.0, (field_group) = "name"];
    bool meta = 2;
    //
    // If value is not null, the value of value should be used as field value.
    //
    ProtoBoxedString value = 3;
    string formatUUID = 4;
    string dataTypeUUID = 5;
    string onChangeCode = 6;
    string placeholder = 7 [(searchable) = true, (weight) = 1.5, (field_group) = "alt"];
    //
    // if bindDefaultValue is true, the result of the defaultValueCode evaluation will not be copied to the value field, but re-evaluated for every
    // time the input field is rendered.
    // if bindDefaultValue is false, the defaultValueCode will be evaluated once and the result will be copied to the value field.
    //
    bool bindDefaultValue = 8;
    string defaultValueCode = 9;

    bool readonly = 10;

    PDFPrintingBehavior pdfPrintingBehavior = 11;

    string pdfFormName = 12;
    string pdfAltText = 13 [(searchable) = true, (weight) = 1.5, (field_group) = "alt"];

    repeated string comChannelUUIDs = 14;
    string uuid = 15 [(identity) = true];
}
enum Inheritance {
  // Inherit from parent element
  INHERITANCE_INHERIT = 0;
  // Evaluate provided code once
  INHERITANCE_CODE = 1;
  // Evaluate provided code every time
  INHERITANCE_BIND_CODE = 2;
  // Use the static value
  INHERITANCE_STATIC = 3;
  // Reset the value to "no value" -> default behaviour
  INHERITANCE_RESET = 4;
}
message ProtoDocumentElement {
  ProtoDocumentElement parent = 1;
  repeated string comChannelUUIDs = 2;
}
message ProtoBranchDocumentElement {
  repeated ProtoDocumentElement _children = 1;

  //extends DocumentElement
  ProtoDocumentElement parent = 2;
  //extends DocumentElement
  repeated string comChannelUUIDs = 3;

}
message ProtoLink {
  // extends BranchDocumentElement
  repeated ProtoDocumentElement _children = 1;
  // extends BranchDocumentElement

  string url = 2 [(searchable) = true, (weight) = 1.0, (field_group) = "other"];
  repeated string comChannelUUIDs = 3;
  string paragraphFormatUUID = 4;
  string paragraphFormatInternalName = 5;
  string urlCode = 6;
  bool bindUrlCode = 7;
  string uuid = 8 [(identity) = true];
}
enum ProtoNumberType {
  ARABIC = 0;
  ROM_UPPERCASE = 1;
  ROM_LOWERCASE = 2;
  LETTER_UPPERCASE = 3;
  LETTER_LOWERCASE = 4;
}

